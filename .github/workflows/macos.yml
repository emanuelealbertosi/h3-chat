name: Build macOS Apple Silicon
on:
  workflow_dispatch:
  workflow_call:
  push:
    branches: ['codex/macos-apple-silicon']
permissions:
  contents: read
jobs:
  macos:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: uname -m
      - run: npm ci
      - run: npm run build
      - name: Build-time CPU graphics dependencies
        run: brew install pkg-config cairo pango
      - uses: actions/cache/restore@v4
        id: native-cache
        with:
          path: |
            build/macos-downloads
            build/macos/H3-Chat/runtime/browser
          key: macos-arm64-${{ hashFiles('scripts/macos-sources.json') }}
      - name: Build native self-contained distribution
        id: build
        run: python scripts/build_macos.py
      - uses: actions/cache/save@v4
        if: steps.native-cache.outputs.cache-hit != 'true'
        with:
          path: |
            build/macos-downloads
            build/macos/H3-Chat/runtime/browser
          key: macos-arm64-${{ hashFiles('scripts/macos-sources.json') }}
      - name: Verify actual packaged components on Apple Silicon
        run: build/macos/H3-Chat/runtime/python/bin/python3 -X utf8 scripts/check_macos.py
      - name: Native sandbox failure diagnostics
        if: failure()
        run: |
          python scripts/diagnose_macos_sandbox.py
          /usr/bin/log show --last 5m --style compact --predicate 'eventMessage CONTAINS "Sandbox:" AND (eventMessage CONTAINS "Python" OR eventMessage CONTAINS "python" OR eventMessage CONTAINS "sandbox-exec")' | tail -60
      - name: Verify ZIP members and create checksum
        run: python scripts/build_macos.py --package
      - uses: actions/upload-artifact@v4
        with:
          name: H3-Chat-macos-arm64
          path: dist/*macos-arm64*
