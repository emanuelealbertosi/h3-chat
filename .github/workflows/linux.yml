name: Build Linux Ubuntu and Kali
on:
  workflow_dispatch:
    inputs:
      reuse_final_run:
        description: 'Optional verified final archive for a Kali-only environment retest'
        required: false
        type: string
      reuse_cpu_run:
        description: 'Optional verified CPU base when only packaging changed'
        required: false
        type: string
      reuse_cuda_run:
        description: 'Optional successful native CUDA job run to reuse without recompiling unchanged engines'
        required: false
        type: string
  workflow_call:
    inputs:
      reuse_final_run:
        description: 'Verified final archive with unchanged application and installer'
        required: false
        type: string
      reuse_cpu_run:
        description: 'Verified CPU base with identical application sources'
        required: false
        type: string
      reuse_cuda_run:
        description: 'Verified native CUDA artifact from an unchanged source build'
        required: false
        type: string
permissions:
  contents: read
  actions: read
jobs:
  cpu:
    if: ${{ !inputs.reuse_cpu_run && !inputs.reuse_final_run }}
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Linux build and desktop dependencies
        timeout-minutes: 12
        run: |
          # The hosted runner's Azure mirror stalled for over 25 minutes on package downloads.
          # Select Ubuntu's official HTTPS mirror only on this disposable build runner.
          if [ -f /etc/apt/apt-mirrors.txt ]; then
            printf '%s\n' 'https://archive.ubuntu.com/ubuntu' | sudo tee /etc/apt/apt-mirrors.txt >/dev/null
          fi
          sudo apt-get -o Acquire::Retries=2 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30 update
          sudo env DEBIAN_FRONTEND=noninteractive apt-get -o DPkg::Lock::Timeout=60 -o Acquire::Retries=2 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30 install -y cmake ninja-build build-essential pkg-config libcairo2-dev libpango1.0-dev bubblewrap libsecret-1-0 gnome-keyring dbus-x11 libnss3 libatk1.0-0 libatk-bridge2.0-0 libxcomposite1 libxdamage1 libxfixes3 libxrandr2 libgbm1 libxkbcommon0 libasound2t64 libvulkan-dev glslc spirv-headers glslang-tools
      - run: npm ci && npm run build
      - name: Install the explicitly authorized bubblewrap exception on the disposable runner
        run: sh scripts/install-linux-sandbox.sh --ci
      - name: Build self-contained Linux CPU and API distribution
        run: python scripts/build_linux.py
      - name: Verify packaged Linux app and native sandbox
        run: dbus-run-session -- bash -c 'printf "h3-disposable-ci-only\n" | gnome-keyring-daemon --unlock --components=secrets; build/linux/H3-Chat/runtime/python/bin/python3 -X utf8 scripts/check_linux.py'
      - name: Package verified CPU base
        run: python scripts/build_linux.py --package
      - uses: actions/upload-artifact@v4
        with:
          name: H3-Chat-linux-cpu-base
          path: dist/*linux-x64*
  cuda:
    if: ${{ !inputs.reuse_cuda_run && !inputs.reuse_final_run }}
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    container: nvidia/cuda:12.8.1-devel-ubuntu24.04
    steps:
      - uses: actions/checkout@v4
      - name: Native compiler prerequisites
        run: apt-get update && apt-get install -y git cmake ninja-build g++ python3 python3-pip libcurl4-openssl-dev
      - uses: actions/cache@v4
        with:
          path: |
            build/linux-native-cuda
            build/linux-sources
          key: linux-cuda-12.8-x64-${{ hashFiles('scripts/linux-sources.json', 'scripts/build_linux.py', 'native/music/CMakeLists.txt', 'native/music/h3-artifacts.patch') }}
          restore-keys: linux-cuda-12.8-x64-
      - name: Build native CUDA engines without loading a GPU or models
        run: python3 scripts/build_linux.py --native-cuda build/linux-cuda/H3-Chat
      - name: Archive native CUDA components and notices
        run: tar -czf H3-Chat-linux-cuda-components.tar.gz -C build/linux-cuda H3-Chat
      - uses: actions/upload-artifact@v4
        with:
          name: H3-Chat-linux-cuda-components
          path: H3-Chat-linux-cuda-components.tar.gz
  package:
    needs: [cpu, cuda]
    if: ${{ always() && !inputs.reuse_final_run && (needs.cpu.result == 'success' || (needs.cpu.result == 'skipped' && inputs.reuse_cpu_run)) && (needs.cuda.result == 'success' || (needs.cuda.result == 'skipped' && inputs.reuse_cuda_run)) }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Verify hardlink compaction and archive exclusions on Linux
        run: python -m unittest discover -s tests -p test_linux_package.py -v
      - uses: actions/download-artifact@v4
        if: ${{ !inputs.reuse_cpu_run }}
        with:
          name: H3-Chat-linux-cpu-base
          path: build/base
      - name: Verify the selected CPU base application source identity
        if: ${{ inputs.reuse_cpu_run }}
        env:
          GH_TOKEN: ${{ github.token }}
          CPU_RUN: ${{ inputs.reuse_cpu_run }}
        run: python scripts/verify_linux_cpu_reuse.py "$CPU_RUN"
      - uses: actions/download-artifact@v4
        if: ${{ inputs.reuse_cpu_run }}
        with:
          name: H3-Chat-linux-cpu-base
          path: build/base
          run-id: ${{ inputs.reuse_cpu_run }}
          github-token: ${{ github.token }}
      - uses: actions/download-artifact@v4
        if: ${{ !inputs.reuse_cuda_run }}
        with:
          name: H3-Chat-linux-cuda-components
          path: build/cuda
      - name: Wait for the selected native CUDA artifact
        if: ${{ inputs.reuse_cuda_run }}
        env:
          GH_TOKEN: ${{ github.token }}
          CUDA_RUN: ${{ inputs.reuse_cuda_run }}
        run: python scripts/wait_linux_cuda.py "$CUDA_RUN"
      - uses: actions/download-artifact@v4
        if: ${{ inputs.reuse_cuda_run }}
        with:
          name: H3-Chat-linux-cuda-components
          path: build/cuda
          run-id: ${{ inputs.reuse_cuda_run }}
          github-token: ${{ github.token }}
      - name: Assemble CPU/API and optional NVIDIA engines
        run: |
          mkdir -p build/linux
          tar -xzf build/base/H3-Chat-*-linux-x64.tar.gz -C build/linux
          tar -xzf build/cuda/H3-Chat-linux-cuda-components.tar.gz -C build/linux
          install -m 755 scripts/install-linux-system.sh build/linux/H3-Chat/Installa-dipendenze-Linux.sh
          install -m 644 scripts/install-linux-system.sh build/linux/H3-Chat/scripts/install-linux-system.sh
          python scripts/compact_linux_runtime.py build/linux/H3-Chat
          python -c 'import json,pathlib;pathlib.Path("build/linux-stage.json").write_text(json.dumps({"path":str(pathlib.Path("build/linux/H3-Chat").resolve())}))'
          python scripts/build_linux.py --package
      - name: Verify archive payloads, links and private-data exclusions
        run: python scripts/verify_linux_package.py
      - uses: actions/upload-artifact@v4
        with:
          name: H3-Chat-linux-x64
          path: dist/*linux-x64*
  kali:
    needs: package
    if: ${{ always() && (needs.package.result == 'success' || inputs.reuse_final_run) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Verify source identity for the selected final archive
        if: ${{ inputs.reuse_final_run }}
        env:
          GH_TOKEN: ${{ github.token }}
          PACKAGE_RUN: ${{ inputs.reuse_final_run }}
        run: python scripts/verify_linux_package_reuse.py "$PACKAGE_RUN"
      - name: Install the already authorized bubblewrap profile on the disposable Ubuntu host
        timeout-minutes: 12
        run: |
          if [ -f /etc/apt/apt-mirrors.txt ]; then printf '%s\n' 'https://archive.ubuntu.com/ubuntu' | sudo tee /etc/apt/apt-mirrors.txt >/dev/null; fi
          sudo apt-get -o Acquire::Retries=2 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30 update
          sudo env DEBIAN_FRONTEND=noninteractive apt-get -o Acquire::Retries=2 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30 install -y bubblewrap
          sh scripts/install-linux-sandbox.sh --ci
          bwrap --unshare-all --unshare-user --ro-bind / / -- /usr/bin/true
      - uses: actions/download-artifact@v4
        with:
          name: H3-Chat-linux-x64
          path: build/kali-input
          run-id: ${{ inputs.reuse_final_run }}
          github-token: ${{ github.token }}
      - name: Verify actual packaged components on Kali Rolling
        run: bash scripts/check_kali_rootfs.sh
      - name: Capture container namespace diagnostics on failure
        if: failure()
        run: sudo journalctl -k --since '-10 minutes' --no-pager | grep -i -E 'apparmor|bwrap|denied' | tail -35 || true
