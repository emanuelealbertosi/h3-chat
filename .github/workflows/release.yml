name: Build Windows macOS and Linux releases
on:
  workflow_dispatch:
    inputs:
      publish_verified:
        description: 'Publish only the explicitly authorized, already verified 0.19.0 packages'
        required: false
        default: false
        type: boolean
      reuse_cuda_run:
        description: 'Optional native Linux CUDA build to verify and reuse'
        required: false
        type: string
  push:
    tags: ['v*']
permissions:
  contents: write
  actions: read
jobs:
  publish-verified:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.publish_verified }}
    uses: ./.github/workflows/publish-verified.yml
  macos:
    if: ${{ !inputs.publish_verified }}
    uses: ./.github/workflows/macos.yml
  linux:
    if: ${{ !inputs.publish_verified }}
    needs: macos
    uses: ./.github/workflows/linux.yml
    with:
      reuse_cuda_run: ${{ inputs.reuse_cuda_run || '' }}
  windows:
    if: ${{ !inputs.publish_verified }}
    runs-on: windows-latest
    steps:
      - name: Prepare canonical temporary directory
        run: |
          $testTemp = Join-Path $env:RUNNER_TEMP 'h3-tests'
          New-Item -ItemType Directory -Force -Path $testTemp | Out-Null
          "TEMP=$testTemp" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "TMP=$testTemp" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Verify API-only clone installation without GPU engines
        run: powershell -NoProfile -ExecutionPolicy Bypass -File scripts/install.ps1 -ApiOnly
      - name: Verify full compiler-free clone installation
        run: powershell -NoProfile -ExecutionPolicy Bypass -File scripts/install.ps1
      - run: npm ci
      - run: npm run build
      - run: python -m unittest discover -s tests -v
      - run: npm test
      - run: powershell -NoProfile -ExecutionPolicy Bypass -File scripts/prepare-build.ps1
      - run: python scripts/install_cpu.py
      - run: powershell -NoProfile -ExecutionPolicy Bypass -File scripts/build-sd-worker.ps1
      - run: python scripts/check_native.py
      - run: python scripts/ci-install-music.py
        env:
          GH_TOKEN: ${{ github.token }}
      - name: Validate full Manim, LaTeX, isolation and cancellation
        run: |
          runtime/python/python.exe -X utf8 scripts/ci-install-manim.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          runtime/python/python.exe -X utf8 scripts/check_manim.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - run: python scripts/bootstrap_bundle.py
      - run: python scripts/package.py
      - name: Verify every packaged file and exclude private data
        run: python scripts/verify_package.py
      - uses: actions/upload-artifact@v4
        with:
          name: H3-Chat-windows-x64
          path: dist/*
      - if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $existing = gh release view $env:GITHUB_REF_NAME --json isDraft 2>$null
          if ($LASTEXITCODE -eq 0) {
            $release = $existing | ConvertFrom-Json
            if ($release.isDraft) {
              gh release upload $env:GITHUB_REF_NAME dist/* --clobber
              if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            } else {
              Write-Host "Published release preserved; verified build retained as workflow artifact."
            }
          } else {
            gh release create $env:GITHUB_REF_NAME dist/* --draft --generate-notes
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
          exit 0
  attach-macos:
    if: startsWith(github.ref, 'refs/tags/')
    needs: [windows, macos]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: H3-Chat-macos-arm64
          path: dist-macos
      - name: Attach verified macOS archive to the draft release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          draft=$(gh release view "$GITHUB_REF_NAME" --json isDraft --jq .isDraft)
          if [ "$draft" = true ]; then
            gh release upload "$GITHUB_REF_NAME" dist-macos/* --clobber
          else
            echo "Published release preserved; macOS package retained as workflow artifact."
          fi
  attach-linux:
    if: startsWith(github.ref, 'refs/tags/')
    needs: [windows, macos, linux]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: H3-Chat-linux-x64
          path: dist-linux
      - name: Attach verified Linux archive to the draft release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          draft=$(gh release view "$GITHUB_REF_NAME" --json isDraft --jq .isDraft)
          if [ "$draft" = true ]; then
            gh release upload "$GITHUB_REF_NAME" dist-linux/* --clobber
          else
            echo "Published release preserved; Linux package retained as workflow artifact."
          fi
