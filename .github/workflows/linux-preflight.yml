name: Check Linux source and process boundaries
on:
  workflow_dispatch:
  push:
    branches: ['codex/platforms-2026-10-26']
    paths: ['.github/workflows/linux-preflight.yml']
permissions:
  contents: read
jobs:
  preflight:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Native test and browser dependencies
        timeout-minutes: 12
        run: |
          if [ -f /etc/apt/apt-mirrors.txt ]; then printf '%s\n' 'https://archive.ubuntu.com/ubuntu' | sudo tee /etc/apt/apt-mirrors.txt >/dev/null; fi
          sudo apt-get -o Acquire::Retries=2 -o Acquire::https::Timeout=30 update
          sudo env DEBIAN_FRONTEND=noninteractive apt-get -o Acquire::Retries=2 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30 install -y bubblewrap g++ libnss3 libatk1.0-0 libatk-bridge2.0-0 libxcomposite1 libxdamage1 libxfixes3 libxrandr2 libgbm1 libxkbcommon0 libasound2t64
      - name: Install the explicitly authorized bubblewrap exception on the disposable runner
        run: sh scripts/install-linux-sandbox.sh --ci
      - name: Diagnose namespace prerequisites without changing host policy
        run: |
          id
          bwrap --version
          cat /proc/sys/kernel/unprivileged_userns_clone /proc/sys/kernel/apparmor_restrict_unprivileged_userns || true
          bwrap --unshare-all --unshare-user --ro-bind / / -- /usr/bin/true || true
          sudo journalctl -k --since '-2 minutes' --no-pager | grep -i -E 'apparmor|bwrap|denied' | tail -20 || true
      - name: Prepare a disposable minimal native test tree
        run: |
          python -c 'import json,pathlib,shutil;from scripts.build_macos import archive;root=pathlib.Path("build/linux-preflight/H3-Chat");spec=json.loads(pathlib.Path("scripts/linux-sources.json").read_text());archive(spec["python"],pathlib.Path("build/linux-preflight-unpack"),pathlib.Path("build/linux-downloads"));shutil.copytree("build/linux-preflight-unpack/python",root/"runtime/python",symlinks=True,dirs_exist_ok=True);shutil.copytree("h3chat",root/"h3chat",dirs_exist_ok=True);(root/"native").mkdir();[shutil.copy2(p,root/"native"/p.name) for p in pathlib.Path("native").glob("*.py")]'
          build/linux-preflight/H3-Chat/runtime/python/bin/python3 -m pip install --only-binary=:all: --target build/linux-preflight/H3-Chat/runtime/tools/documents -r scripts/linux-requirements.txt
      - name: Compile the persistent image bridge on Linux
        run: |
          g++ -O2 -std=c++17 native/sd-worker.cpp -ldl -pthread -o build/linux-preflight/H3-Chat/native/h3-sd-worker
          cc -O2 scripts/linux-process-guard.c -o build/linux-preflight/H3-Chat/runtime/tools/h3-process-guard
      - name: Check native file/process boundaries with an explicit user namespace
        run: build/linux-preflight/H3-Chat/runtime/python/bin/python3 -X utf8 scripts/check_posix.py build/linux-preflight/H3-Chat
      - name: Install the actual packaged browser for the PDF probe
        env:
          PLAYWRIGHT_BROWSERS_PATH: build/linux-preflight/H3-Chat/runtime/browser
        run: |
          python -c 'from pathlib import Path;import shutil;root=Path("build/linux-preflight/H3-Chat");shutil.copytree("static",root/"static",dirs_exist_ok=True);import zipfile;bundle=zipfile.ZipFile("distribution/windows-bootstrap.zip");[bundle.extract(n,root) for n in bundle.namelist() if n.startswith("static/")]'
          build/linux-preflight/H3-Chat/runtime/python/bin/python3 -c 'import sys,runpy;sys.path.insert(0,"build/linux-preflight/H3-Chat/runtime/tools/documents");sys.argv=["playwright","install","chromium","--only-shell"];runpy.run_module("playwright",run_name="__main__")'
      - name: Verify offline PDF with Chromium sandbox and outer file/network isolation
        run: build/linux-preflight/H3-Chat/runtime/python/bin/python3 -X utf8 scripts/check_linux_pdf.py build/linux-preflight/H3-Chat
