name: Build optional image runtime
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  runtime:
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install pinned official wheels
        run: >-
          python -m pip install --no-cache-dir --only-binary=:all: --no-deps
          --extra-index-url https://download.pytorch.org/whl/cu130 -r scripts/vision-requirements.txt
      - name: Build isolated runtime and verify wheel files
        run: python scripts/build-vision-runtime.py
      - name: Verify pinned upstream source
        run: python scripts/prepare-vision-core.py
      - name: Package runtime
        run: python scripts/package-vision-runtime.py
      - name: Upload to the existing draft
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $release = gh release view v0.7.0 --json isDraft | ConvertFrom-Json
          if ($LASTEXITCODE -ne 0 -or -not $release.isDraft) { throw 'A draft v0.7.0 release is required.' }
          Copy-Item -LiteralPath runtimes.json -Destination dist/vision-runtime-manifest.json
          gh release upload v0.7.0 dist/H3-Chat-vision-engine-0.7.0-windows-x64.zip dist/H3-Chat-vision-engine-0.7.0-windows-x64.zip.sha256 dist/vision-runtime-manifest.json --clobber
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
